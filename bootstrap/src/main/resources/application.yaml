server:
  port: 9090
  servlet:
    context-path: /api/ragent  # 全局路径前缀，所有接口都在 /api/ragent 下

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB # 单个上传文件最大 50MB
      max-request-size: 100MB # 整个 multipart 请求最大 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://192.168.137.100:5432/ragent?client_encoding=UTF8
    hikari:
      connection-timeout: 5000 # 获取连接超时 5s
      idle-timeout: 600000 #空闲连接超过 10 分钟（600000ms）被回收
      max-lifetime: 1800000 # 连接最大存活 30 分钟
      maximum-pool-size: 10 # 最大连接数
      minimum-idle: 5 # 最小空闲连接数
      pool-name: RagentHikariPool # 连接池名称

  data:
    redis:
      host: 127.0.0.1
      port: 6379
     # password: 123456

ragent:
  engine:
    type: agent  # 执行架构档位，可选 workflow（v1 编排管线）/ agent（v2 ReAct 架构，RAG 管线降级为主 Agent 的一个 Tool）
  demo-mode: false # 演示模式开关
  eval:
    enabled: true # 是否启用评估模块

# ============================================================
# Agent 执行架构（ragent.engine.type=agent 时生效）；单模型无 fallback，供应商可用性由 provider 侧保障
# ============================================================
agent:
  mcp:
    servers:
      - name: default # MCP 服务名
        url: http://localhost:9099 # MCP 服务地址
  chat:
    provider: ollama   # 聊天模型供应商，此处用本地 Ollama 的 OpenAI 兼容端点
    model: qwen3.5:2b
  max-iters: 10         # ReAct 循环上限，超出后熔断收尾
  max-retries: 1        # 最大尝试次数含首次，1 即不重试
  sse-timeout-ms: 900000 # SSE 超时 15 分钟
  memory:
    context-window-chars: 100000 # 上下文窗口字符数上限
    summary-enabled: true # 是否启用上下文摘要压缩
    long-term-enabled: true # 是否启用长期记忆
    evictable-tools: [ search_knowledge ]  # 可被驱逐的工具列表
  trace:  #$agent.trace 配置块是 Agent 引擎的链路追踪（Observability）配置，用来把 Agent 每一次运行的内部步骤上报到 Langfuse
    enabled: false  #  # 是否启用 Langfuse 追踪；开启前先起 resources/docker/langfuse 那套服务
    capture-content: true  # 记录提示词与工具出入参；纯骨架改 false
    endpoint: http://192.168.137.100:3000/api/public/otel/v1/traces
    public-key: pk-lf-ragent-local     # 与 compose 里的 LANGFUSE_INIT_PROJECT_PUBLIC_KEY 一致
    secret-key: sk-lf-ragent-local     # 与 compose 里的 LANGFUSE_INIT_PROJECT_SECRET_KEY 一致
    max-field-chars: 32768
    max-attribute-chars: 131072 # 超限退成带 preview 的合法 JSON
    service-version:  # 留空取 build-info 版本；要盖 pom 版本才填
    environment:      # 如 local / staging / prod

# ============================================================
# RAG 检索增强配置
# ============================================================
rag:
  storage:
    type: s3  # 存储类型：s3（rustfs / minio）/ oss（阿里云）
    kb-bucket: ragent-sources        # 全局知识库桶（私有），所有知识库文档按 collectionName 目录隔离；OSS 桶名全局唯一，生产需按部署覆盖
    asset-bucket: ragent-assets # 多模态资产桶（公共读），PDF 抽出的图片等供浏览器匿名直连预览
    s3:
      endpoint: http://192.168.137.100:9002
      access-key: rustfsadmin
      secret-key: rustfsadmin
      region: us-east-1
      path-style: true # 使用 path-style 访问
      public-url:  # 内外网端点不同时配置，留空回退 endpoint
    oss:
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      access-key: ${OSS_ACCESS_KEY:}
      secret-key: ${OSS_SECRET_KEY:}
      region: cn-hangzhou
      public-url:  # 虚拟主机式基址（含 bucket 子域），如 https://ragent-assets.oss-cn-hangzhou.aliyuncs.com；留空由 endpoint 推导

  vector:
    type: pg  # 可选 milvus / pg  ，pg代表使用 PostgreSQL + pgvector

#关键词检索和图谱检索，是在现有向量检索之外增加的两种“找资料的方法”
  keyword:   #关键词检索
    type: none    # 关键词检索类型：none / es
    es:
      uris: http://192.168.137.100:9200
      index: rag_keyword_store  # 全库共享索引，按 collection_name 字段区分知识库
      analyzer: ik_max_word   #使用 IK 中文分词器：前者用于建索引
      search-analyzer: ik_smart  #后者用于分析搜索文本

  graph:    #图谱
    type: lightrag  # 启用图谱接入和整篇文档同步；是否参与问答检索由 rag.search.channels.graph.enabled 控制
    lightrag:
      base-url: http://192.168.137.100:9621
      query-mode: hybrid
    embedding-model: qwen3.7-text-embedding  # 图谱服务的独立模型，由服务器 .env 决定；不随下方 Java 向量模型切换

  default:
    collection-name: rag_default_store
    dimension: 1024  # Flash 向量模型维度；PG 向量列同步为 vector(1024)，仅重建后的向量参与检索
    metric-type: COSINE # 相似度度量方式
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true # 是否启用查询改写

  rerank:
    enabled: true # 是否启用重排序

  citation:
    enabled: true  # 回答行内引用角标 [N](#cite-N)：开启会动态追加引用规则并为资料注入编号，增加首字延迟；关闭不影响文档级来源面板

  rate-limit:
    global:
      enabled: true
      max-concurrent: 10 # 全局最大并发数
      max-wait-seconds: 15  # 最大等待秒数
      lease-seconds: 30 # 租约秒数
      poll-interval-ms: 200 # 轮询间隔

  memory:
    history-keep-turns: 8 # 保留最近 8 轮历史
    summary-enabled: true # 启用摘要
    summary-start-turns: 9 # 从第 9 轮开始摘要
    summary-max-chars: 400 # 摘要最大字符数
    title-max-length: 30 # 标题最大长度

  semaphore:
    document-upload: # 限流规则名称/业务作用域：专门用于“文档上传”场景
      name: rag:document:upload              # 分布式信号量唯一标识：多实例共享同一个信号量时使用该 key
      max-concurrent: 10                     # 最大并发许可数：同一时刻最多允许 10 个文档上传任务同时执行
      max-wait-seconds: 5                    # 最大等待秒数：拿不到许可时最多等待 5 秒，超时则快速失败/抛异常
      lease-seconds: 300                     # 许可租约有效期：获取许可后租约为 300 秒；持有者崩溃未释放时，到期后许可自动回收
      # 长任务通常需要后台心跳续期，避免租约在任务完成前过期

  knowledge:
    schedule:
      scan-delay-ms: 10000        # 扫描延迟：任务启动后延迟 10 秒再扫描，或每轮扫描前延迟 10s
      lock-seconds: 900           # 分布式锁/任务锁时长：锁定 15 分钟，防止多实例重复扫描或重复处理
      batch-size: 20              # 批处理大小：每批最多处理 20 条知识/文档记录
      min-interval-seconds: 60    # 最小调度间隔：两次扫描之间至少间隔 60 秒，避免扫描过于频繁

  search:
    # 执行顺序（YAML 书写顺序 ≠ 执行顺序，这里刻意按执行时间线排）
    # 第0步 scope 定范围 → 第1步 channels 并行召回 → 第2步 fusion 融合
    # → 第3步截断 rerank-candidate-limit → 第4步 Rerank 精排
    # → 第5步 evidence 闸门 → 第6步取 default-top-k 进 LLM
    # ==========================================================

    # ---------- 第0步：scope，最先执行，决定“本次看哪些知识库” ----------
    # 检索作用域：本次请求该看哪些知识库，与用什么模态检索无关，故与 channels 平级、三条通道共读
    # 判定只看 KB 意图最高分，不看意图个数；关掉任一通道都不影响其余通道的作用域
    scope:
      min-intent-score: 0.4        # 低于此分的意图节点不参与「是否收窄」的判定
      confidence-threshold: 0.6    # 最高分 ≥ 0.6 → 定向检索（只查命中的库）；< 0.6 → 退化为全库检索，不冒险收窄
      supplement-ratio: 0.25       # 定向时各通道从自身产出额度划给「未命中库」的保底比例，兜住意图判错；0=关闭补充路，命中库已覆盖全库时自动不补

    # ---------- 第1步：channels + recall-budget，多通道并行宽召回 ----------
    recall-budget: 20              # ① 每通道召回条数（绝对值，向量意图路/关键词/图谱共用）；须 ≥ default-top-k，0=回退 default-top-k
    channels:
      timeout-ms: 15000            # 单通道查询超时上限（毫秒），超时只影响本通道，不拖垮整体
      vector:
        enabled: true              # 向量通道总开关
      keyword:
        enabled: false             # 检索范围读引擎解析好的作用域，与向量通道同源
      graph:
        enabled: true              # 图谱检索通道开关：false 不参与问答召回（后端仍在，后台可视化照常）；置 true 前需先开 rag.graph.type=lightrag
      web-search:
        enabled: false
        count: 5
        timeout-seconds: 10
        api-key: ${YDC_API_KEY:}

    # ---------- 第2步：fusion，RRF 融合成一个候选池 ----------
    fusion:
      strategy: rrf                # 融合策略：RRF
      rrf-k: 20                    # 候选池通常仅 20~40 条，k=60 会过度平滑名次；调低至 20 让头部更有区分度（配合「检索归因」日志校准）
      channel-weights:
        vector: 1.0                # 向量通道：满权重，语义召回是主力，可控可信
        keyword: 1.0               # 关键词通道：满权重，精确词匹配可信度高（当前 enabled=false，不生效）
        graph: 0.8                 # 图谱通道：打 8 折，关系推理有价值但实体/关系抽取可能有误差，防止压过向量召回
        web-search: 0.5            # 联网检索：打 5 折，外部结果质量参差、时效不可控，仅作兜底补充
      # ---------- 第3步：融合后截断，控制精排成本 ----------
      rerank-candidate-limit: 40   # ② RRF 融合后送入 Rerank 的候选池上限，<=0 不截断（经验值 40~100）

    # ---------- 第4步：Rerank 精排（无独立配置，模型由 ai.rerank 决定） ----------

    # ---------- 第5步：evidence 闸门，整批丢弃的兜底 ----------
    # 证据相关性闸门：检索只保证返回最像的 N 条，库里没答案时照样满额返回，这里补一道相关度下限
    evidence:
      min-rerank-score: 0.2        # 整批最高精排分低于此值则整批丢弃，0=关闭；随 reranker 而变，换模型看「检索归因 - 精排分布」重测

    # ---------- 第6步：default-top-k，最终截断进 LLM（配置写在最后、执行也最后） ----------
    # 检索漏斗三段预算，各自独立、单调收窄，启动时校验 recall-budget ≥ default-top-k 且 rerank-candidate-limit ≥ default-top-k
    default-top-k: 10              # ③ 最终进 LLM 的条数（产品语义的 topK）

  # agent.trace 是Agent 整体运行上报 Langfuse 的外部追踪，rag.trace 是RAG 检索漏斗的内部追踪/错误记录
  trace:
    enabled: true              # 是否记录 RAG 检索链路的追踪信息
    max-error-length: 1000     # 单条错误信息最多保留 1000 字符

  # 图片解析（图生文）配置
  # 产出一段自包含的知识文本：既说清"图是什么"，又完整保留所有文字与层级
  image-parse:
    description-prompt: |-
      请把这张图片的内容转写成一段自包含的知识文本，用于知识库检索与问答，不要描述颜色、布局、字体等视觉样式。要求：
      1. 开头用一两句话说明这张图是什么（主题、类型、用途），让人不看图也能明白讲的是什么。
      2. 随后按图中的分组、层级、流程关系，完整转写所有文字内容（OCR），保留每个分组标题与其下属条目的归属关系，不要遗漏任何文字。
      3. 若是图表、架构图或流程图，请补充说明各部分之间的关系（如包含、调用、先后顺序），而不只是罗列文字。
      4. 保持术语准确完整，表述贴近用户可能的提问方式。
      5. 最后另起一行，用一句话自然引出图片（例如"下方为该内容对应的原始图片："），以便在这段文字后紧接着展示图片。
    max-output-tokens: 4096

# ============================================================
# AI 模型供应商配置
# ============================================================
ai:
  providers:
    ollama:
      url: http://localhost:11434
      api-key: ollama   # OpenAI 兼容客户端需要非空值；本地 Ollama 不校验此值
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: sk-0e820ca33e424b8c988c0ad5fe7b511e #百炼 api-key
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
        embedding: /compatible-mode/v1/embeddings
    aihubmix:
      url: https://aihubmix.com
      api-key: ${AIHUBMIX_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    deepseek:
      url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      endpoints:
        chat: /v1/chat/completions

  selection:
    failure-threshold: 2  # 失败阈值
    open-duration-ms: 30000 # 熔断开启时长

  stream:
    message-chunk-size: 1 # 流式消息块大小

  chat:
    candidates:    # 聊天模型候选列表
      - id: qwen3-local
        provider: ollama
        model: qwen3.5:2b
        supports-thinking: true
      - id: deepseek-flash
        provider: deepseek
        model: deepseek-flash
        supports-thinking: true

    default-tier: standard  # 默认档位
    deep-thinking-tier: deep  # 深度思考档位

    tiers:      # 档位定义
      fast:
        candidates: [ qwen3-local ]
        timeout-ms: 120000
      standard:
        candidates: [ qwen3-local ]
        timeout-ms: 120000
      deep:
        candidates: [ qwen3-local ]
        timeout-ms: 180000

  embedding:
    default-model: qwen37-embedding  # 内部模型 ID；实际调用有剩余免费额度的 Flash 版本
    candidates:
      - id: qwen37-embedding
        provider: bailian
        model: qwen3.7-text-embedding-flash
        dimension: ${rag.default.dimension}
        priority: 1
      # 兼容已有知识库保存的旧内部 ID；向量表为空后切换，仍调用同一个 Flash 模型
      - id: qwen-emb-8b
        provider: bailian
        model: qwen3.7-text-embedding-flash
        dimension: ${rag.default.dimension}
        priority: 10
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: ${rag.default.dimension}
        priority: 2
        enabled: false  # 当前 Ollama 尚未安装此向量模型，避免 404 回退


  rerank:
    default-model: qwen3-rerank  # 内部模型 ID；实际调用下面的 qwen3.7-text-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3.7-text-rerank  #使用新人额度 重排序模型
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

  vlm:
    default-model: qwen-vl-max  # 默认视觉语言模型
    candidates:
      - id: qwen-vl-max
        provider: bailian
        model: qwen-vl-max


# ============================================================
# MinerU 文档解析 SaaS API 配置
# ===========================================================

# MinerU SaaS API 配置（PDF / Word / PPT 走 MinerU 解析）
mineru:
  api-url: https://mineru.net/api/v4
  api-key: ${MINERU_API_KEY:}
  poll-interval-seconds: 5         # 轮询间隔
  timeout-seconds: 300             # 超时时间
  enable-table: true               # 启用表格解析
  enable-formula: true             # 启用公式解析
  ocr: false                       # 是否启用 OCR
  language: ch                     # 语言
  concurrency-limit: 5             # 并发限制
  semaphore-name: rag:mineru:parse # 信号量名称
  max-wait-seconds: 30             # 最大等待秒数
  lease-seconds: 900               # 租约秒数

# ============================================================
# Sa-Token 权限认证配置
# ============================================================
sa-token:
  token-name: Authorization        # token 名称
  timeout: 2592000                 # 有效期 30 天
  is-concurrent: true              # 是否允许并发登录
  is-share: false                  # 是否共享 token
  token-style: simple-uuid         # token 风格
  is-log: false                    # 是否打印日志
  is-print: false                  # 是否打印 banner

# ============================================================
# RocketMQ 配置
# ============================================================
rocketmq:
  name-server: 192.168.137.100:9876
  producer:
    group: ragent-producer${unique-name:}_pg # 生产者组
    send-message-timeout: 10000  # 发送超时 10s，给首次路由查询和连接建立留出时间

# ============================================================
# Milvus 向量库配置
# ============================================================
milvus:
  uri: http://192.168.137.100:19531  # 改为 19531
